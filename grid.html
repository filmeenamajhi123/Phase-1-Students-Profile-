<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Layout</title>

  <style>

   *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      height: 100vh;
      background: rgb(50, 41, 59);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container{
      height: 500px;
      width: 900px;

      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 10px;

    }
    .box{
      border-radius: 10px;
    }
    .box1{
      background: green;
      grid-row: 1/4;
      grid-column: 1/1;
    }
    .box2{
      background: green;
      grid-column: 2/4;
    }    
    .box3{
      background: red;
    } 
    .box4{
      background: yellow;
    } 
    .box5{
      background: red;
    } 
    .box6{
      background: green;
      grid-row: 2/4;
      grid-column: 4/4;
    } 
    .box7{
      background: red;
    } 
    .box8{
      background: yellow;
    } 

  </style>
</head>

<body>

  <div class="container">

    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>
    <div class="box box7"></div>
    <div class="box box8"></div>

  </div>

</body>
</html>
